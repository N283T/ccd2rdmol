[project]
name = "ccd2rdmol"
version = "0.2.2"
description = "Convert PDB Chemical Component Dictionary (CCD) files to RDKit molecules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "N283T" }]
keywords = ["pdb", "ccd", "rdkit", "chemistry", "molecular"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "gemmi>=0.7.0,<1",
    "rdkit>=2024.3.1,<2026",
]

[project.optional-dependencies]
cli = [
    "rich>=14.0.0,<15",
    "typer>=0.21.0,<1",
]

[project.scripts]
ccd2rdmol = "ccd2rdmol.cli:main"

[project.urls]
Repository = "https://github.com/N283T/ccd2rdmol"
Changelog = "https://github.com/N283T/ccd2rdmol/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccd2rdmol"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "PERF", # perflint
    "RUF",  # ruff-specific
    "FURB", # refurb
]

[dependency-groups]
dev = [
    "ccd2rdmol[cli]",
    "nox>=2024.10.9",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a7",
]

[tool.coverage.run]
source = ["src/ccd2rdmol"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
